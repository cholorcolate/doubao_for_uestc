<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成电智答 · 电子科技大学校园智能体</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#081224;
  --bg-soft:#0C1B33;
  --card:#10213F;
  --card-2:#14294D;
  --line:rgba(150,180,228,0.16);
  --primary:#2D6CDF;
  --primary-deep:#1B4FA8;
  --accent:#E8B84B;
  --cyan:#57C7E4;
  --text:#EAF1FB;
  --text-2:#A9B9D2;
  --text-3:#6E82A6;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
svg{display:block}

/* ===== 页 ===== */
.page{position:relative;min-height:100vh;display:flex;flex-direction:column}
.bg{position:absolute;inset:0;background-image:url('https://aka.doubaocdn.com/s/AueEtGcVEj');background-size:cover;background-position:center 32%;opacity:.6}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,36,0.74) 0%,rgba(8,18,36,0.4) 50%,var(--bg) 100%)}
.content{position:relative;flex:1;display:flex;flex-direction:column}

/* ===== 顶栏 ===== */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:1px}
.brand .logo{width:28px;height:28px;color:var(--accent)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav-btn{font-size:13.5px;color:var(--text-2);background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 16px;transition:all .2s}
.nav-btn:hover{color:#fff;border-color:var(--line)}
.nav-btn.active{color:#fff;background:var(--primary);border-color:var(--primary)}

/* ===== 视图 ===== */
.views{position:relative;flex:1;display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column}
.view.active{display:flex}

/* ===== 主体（问答） ===== */
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 40px;text-align:center}
.main h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,4.6vw,46px);letter-spacing:2px}
.main h1 em{font-style:normal;color:var(--accent)}
.main .sub{margin-top:12px;color:var(--text-2);font-size:15px;letter-spacing:3px}

/* ===== 面板（信息聚合/工具/我的共用） ===== */
.pane{width:100%;max-width:880px;margin:0 auto;padding:10px 24px 48px}
.pane-head{text-align:center;margin-bottom:18px}
.pane-head h2{font-family:var(--serif);font-weight:900;font-size:clamp(24px,3.4vw,32px);letter-spacing:2px}
.pane-head h2 em{font-style:normal;color:var(--accent)}
.pane-sub{display:block;margin-top:6px;font-size:13px;color:var(--text-3);letter-spacing:1px}

/* ===== 聊天卡 ===== */
.chat-card{width:100%;max-width:640px;margin-top:34px;text-align:left;background:linear-gradient(180deg,rgba(18,35,66,0.94),rgba(13,27,50,0.97));border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.45)}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.chat-head .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.chat-head .t{font-size:14.5px;font-weight:600}
.msg-area{height:300px;overflow-y:auto;padding:18px 18px 6px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:rgba(150,180,228,0.25) transparent}
.msg{display:flex;gap:10px;max-width:92%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{flex:0 0 30px;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.msg.user .msg-avatar{background:var(--primary);color:#fff}
.msg.bot .msg-avatar{background:rgba(232,184,75,0.14);color:var(--accent);border:1px solid rgba(232,184,75,0.3)}
.msg-avatar svg{width:17px;height:17px}
.bubble{padding:10px 14px;border-radius:14px;font-size:14px;animation:msgIn .35s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.user .bubble{background:var(--primary-deep);border-bottom-right-radius:4px}
.msg.bot .bubble{background:var(--card-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.src-line{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--text-3)}
.src-line svg{width:12px;height:12px;color:var(--cyan)}
.src-detail{margin-top:8px;font-size:12px}
.src-detail summary{cursor:pointer;color:var(--text-3);user-select:none}
.src-detail summary:hover{color:var(--cyan)}
.src-item{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.src-item a{flex:1;min-width:0;color:var(--cyan);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-item a:hover{text-decoration:underline}
.src-item .src-meta{color:var(--text-3);white-space:nowrap;font-size:11px}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--text-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.quick-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.quick{font-size:12.5px;color:var(--text-2);background:rgba(45,108,223,0.12);border:1px solid rgba(45,108,223,0.35);border-radius:999px;padding:7px 14px;transition:all .2s}
.quick:hover{color:#fff;background:var(--primary);border-color:var(--primary)}
.filter-row{display:flex;gap:8px;padding:10px 18px 0;flex-wrap:wrap}
.filter-row select{font-family:inherit;font-size:12.5px;color:var(--text-2);background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:6px 12px;outline:none;transition:border-color .2s;cursor:pointer}
.filter-row select:focus{border-color:var(--primary)}
.filter-row select option{background:var(--bg-soft);color:var(--text)}
.input-row{display:flex;align-items:center;gap:10px;padding:12px 14px 16px}
.input-box{flex:1;display:flex;align-items:center;background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 16px;transition:border-color .25s,box-shadow .25s}
.input-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,108,223,0.22)}
.input-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14.5px;font-family:inherit;height:42px;min-width:0}
.input-box input::placeholder{color:var(--text-3)}
.send-btn{width:44px;height:44px;border:none;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
.send-btn:hover{background:#3B7AE8}
.send-btn:active{transform:scale(.94)}
.send-btn svg{width:20px;height:20px}

/* ===== 信息聚合 ===== */
.feed-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.ftab{font-size:13px;color:var(--text-2);background:rgba(45,108,223,0.1);border:1px solid var(--line);border-radius:999px;padding:7px 18px;transition:all .2s}
.ftab:hover{color:#fff;border-color:var(--primary)}
.ftab.active{color:#fff;background:var(--primary);border-color:var(--primary)}
.feed-list{display:flex;flex-direction:column;gap:10px;min-height:120px}
.feed-item{display:flex;gap:12px;align-items:flex-start;background:rgba(16,33,63,0.88);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .2s}
.feed-item:hover{border-color:rgba(45,108,223,0.55)}
.fi-main{flex:1;min-width:0}
.fi-title{display:block;color:var(--text);font-size:15px;font-weight:600;text-decoration:none;line-height:1.45}
.fi-title:hover{color:var(--cyan)}
.fi-meta{margin-top:4px;font-size:12px;color:var(--text-3)}
.fi-snippet{margin-top:6px;font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fav-btn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text-3);font-size:16px;line-height:1;transition:all .2s}
.fav-btn:hover{border-color:var(--accent);color:var(--accent)}
.fav-btn.on{color:var(--accent);border-color:rgba(232,184,75,0.5);background:rgba(232,184,75,0.1)}
.fav-btn.mini{width:26px;height:26px;font-size:13px;border-radius:8px}
.pager{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px}
.pager button{font-size:12.5px;color:var(--text-2);background:rgba(45,108,223,0.12);border:1px solid rgba(45,108,223,0.35);border-radius:999px;padding:7px 16px;transition:all .2s}
.pager button:hover:not(:disabled){color:#fff;background:var(--primary);border-color:var(--primary)}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-size:12.5px;color:var(--text-3)}
.empty{text-align:center;color:var(--text-3);font-size:14px;padding:34px 0}

/* ===== 校园工具 ===== */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tool-card{background:rgba(16,33,63,0.88);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;color:var(--text);transition:all .2s}
.tool-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.tool-card.active{border-color:var(--primary);background:var(--card-2)}
.tool-card .t-name{font-size:16px;font-weight:600}
.tool-card .t-desc{margin-top:6px;font-size:12.5px;color:var(--text-3)}
.tool-result{margin-top:20px}
.tr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tr-title{font-size:14.5px;font-weight:600;color:var(--accent)}
.tool-result .feed-list{min-height:60px}

/* ===== 我的 ===== */
.mine-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.mtab{font-size:13px;color:var(--text-2);background:rgba(45,108,223,0.1);border:1px solid var(--line);border-radius:999px;padding:7px 22px;transition:all .2s}
.mtab:hover{color:#fff;border-color:var(--primary)}
.mtab.active{color:#fff;background:var(--primary);border-color:var(--primary)}
.sub-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sub-bar select{font-family:inherit;font-size:12.5px;color:var(--text-2);background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;padding:7px 12px;outline:none;cursor:pointer;max-width:240px}
.sub-bar select option{background:var(--bg-soft);color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(45,108,223,0.15);border:1px solid rgba(45,108,223,0.4);color:var(--text);border-radius:999px;padding:5px 13px;font-size:12.5px}
.chip .x{cursor:pointer;color:var(--text-3);font-size:14px}
.chip .x:hover{color:#f66}
.sub-group{margin-bottom:18px}
.sub-group h3{font-size:14px;color:var(--accent);margin-bottom:8px;font-weight:600}
.mine-section-title{text-align:center;font-size:13.5px;color:var(--text-2);margin:4px 0 12px}

/* ===== 页脚 ===== */
.foot{padding:20px 24px 28px;text-align:center}
.foot .motto{font-family:var(--serif);color:var(--text-2);font-size:13px;letter-spacing:4px}
.foot .note{margin-top:6px;font-size:11.5px;color:var(--text-3)}

@media (max-width:768px){
  .bar{padding:16px 18px}
  .main{padding:0 16px 28px}
  .chat-card{margin-top:26px}
  .msg-area{height:280px}
  .pane{padding:8px 16px 40px}
}
</style>
</head>
<body>
<div class="page">
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="content">

    <div class="bar">
      <span class="brand">
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c2.8 1.4 5 1.8 7 1.8v8.2c0 4.4-3.4 8-7 10-3.6-2-7-5.6-7-10V4.8c2 0 4.2-.4 7-1.8z"/><path d="M12 6v13M9.5 10h5"/></svg>
        成电智答
      </span>
      <nav class="nav" id="nav">
        <button class="nav-btn active" data-view="chat">智能问答</button>
        <button class="nav-btn" data-view="feed">信息聚合</button>
        <button class="nav-btn" data-view="tools">校园工具</button>
        <button class="nav-btn" data-view="mine">我的</button>
      </nav>
    </div>

    <div class="views">

      <!-- ===== 智能问答 ===== -->
      <section class="view active" id="view-chat">
        <div class="main">
          <h1>懂成电的<em>智能体</em></h1>
          <p class="sub">选课 · 保研 · 校历 · 班车</p>

          <div class="chat-card">
            <div class="chat-head">
              <span class="dot"></span>
              <span class="t">成电智答</span>
            </div>
            <div class="msg-area" id="msgArea">
              <div class="msg bot">
                <span class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c2.8 1.4 5 1.8 7 1.8v8.2c0 4.4-3.4 8-7 10-3.6-2-7-5.6-7-10V4.8c2 0 4.2-.4 7-1.8z"/><path d="M12 6v13M9.5 10h5"/></svg></span>
                <div class="bubble">你好，可以问我校园政策、办事流程这类问题。</div>
              </div>
            </div>
            <div class="quick-row" id="quickRow">
              <button class="quick" data-q="保研成绩怎么算？">保研成绩怎么算？</button>
              <button class="quick" data-q="这学期校历安排">这学期校历安排</button>
              <button class="quick" data-q="清水河到沙河班车时刻">清水河到沙河班车时刻</button>
            </div>
            <div class="filter-row">
              <select id="boardSel" aria-label="板块筛选">
                <option value="">全部板块</option>
              </select>
              <select id="timeSel" aria-label="时间筛选">
                <option value="">全部时间</option>
                <option value="1m">最近一月</option>
                <option value="3m">最近三月</option>
                <option value="1y">最近一年</option>
                <option value="3y">最近三年</option>
              </select>
            </div>
            <div class="input-row">
              <div class="input-box">
                <input id="chatInput" type="text" placeholder="输入你的问题…" autocomplete="off">
                <button class="send-btn" id="sendBtn" aria-label="发送">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== 信息聚合 ===== -->
      <section class="view" id="view-feed">
        <div class="pane">
          <div class="pane-head">
            <h2>信息<em>聚合</em></h2>
            <span class="pane-sub">通知公告 · 讲座 · 竞赛 · 招聘，来自论坛知识库</span>
          </div>
          <div class="feed-tabs" id="feedTabs"></div>
          <div class="feed-list" id="feedList"><div class="empty">加载中…</div></div>
          <div class="pager">
            <button id="prevPage">上一页</button>
            <span id="pageInfo"></span>
            <button id="nextPage">下一页</button>
          </div>
        </div>
      </section>

      <!-- ===== 校园工具 ===== -->
      <section class="view" id="view-tools">
        <div class="pane">
          <div class="pane-head">
            <h2>校园<em>工具</em></h2>
            <span class="pane-sub">校历 · 班车 · 课表 · 场馆，资料来自知识库检索</span>
          </div>
          <div class="tool-grid" id="toolGrid"><div class="empty">加载中…</div></div>
          <div class="tool-result" id="toolResult"></div>
        </div>
      </section>

      <!-- ===== 我的 ===== -->
      <section class="view" id="view-mine">
        <div class="pane">
          <div class="pane-head">
            <h2>我的<em>收藏</em></h2>
            <span class="pane-sub">收藏与订阅保存在本浏览器，无需登录</span>
          </div>
          <div class="mine-tabs">
            <button class="mtab active" data-mine="fav">收藏</button>
            <button class="mtab" data-mine="sub">订阅</button>
          </div>
          <div id="mineFav"><div class="empty">加载中…</div></div>
          <div id="mineSub" hidden></div>
        </div>
      </section>

    </div>

    <div class="foot">
      <div class="motto">求实求真 · 大气大为</div>
      <div class="note">本地运行 · 数据来自清水河畔论坛知识库</div>
    </div>

  </div>
</div>

<script>
(function(){
  "use strict";

  /* ===== 通用工具 ===== */
  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ===== 收藏 / 订阅（localStorage，无需登录） ===== */
  var FAV_KEY = "zd_favorites";
  var SUB_KEY = "zd_subscriptions";

  function loadFavs(){
    try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveFavs(list){ localStorage.setItem(FAV_KEY, JSON.stringify(list)); }
  function loadSubs(){
    try { return JSON.parse(localStorage.getItem(SUB_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveSubs(list){ localStorage.setItem(SUB_KEY, JSON.stringify(list)); }
  function favId(item){ return (item.url || "") + "|" + (item.title || ""); }
  function isFaved(item){
    var id = favId(item);
    return loadFavs().some(function(f){ return favId(f) === id; });
  }
  function toggleFav(item){
    var list = loadFavs(), id = favId(item), idx = -1;
    list.forEach(function(f, i){ if (favId(f) === id) idx = i; });
    if (idx >= 0){ list.splice(idx, 1); saveFavs(list); return false; }
    list.unshift({
      title: item.title, url: item.url,
      board: item.board || "", time: item.time || "", ts: Date.now()
    });
    saveFavs(list);
    return true;
  }
  function favBtnHtml(it, mini){
    var on = isFaved(it);
    return '<button class="fav-btn' + (on ? " on" : "") + (mini ? " mini" : "") +
      '" title="' + (on ? "取消收藏" : "收藏") + '"' +
      ' data-title="' + esc(it.title) + '" data-url="' + esc(it.url) + '"' +
      ' data-board="' + esc(it.board || "") + '" data-time="' + esc(it.time || "") + '">' +
      (on ? "★" : "☆") + "</button>";
  }

  // 收藏按钮全局委托：信息流/工具/订阅/问答来源/我的 共用
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".fav-btn");
    if (!btn) return;
    var item = {
      title: btn.dataset.title, url: btn.dataset.url,
      board: btn.dataset.board, time: btn.dataset.time
    };
    var now = toggleFav(item);
    // 同一条目的所有星标按钮同步状态
    document.querySelectorAll(".fav-btn").forEach(function(b){
      if (b.dataset.title === item.title && b.dataset.url === item.url){
        b.classList.toggle("on", now);
        b.textContent = now ? "★" : "☆";
        b.title = now ? "取消收藏" : "收藏";
      }
    });
    if (currentView === "mine" && mineTab === "fav") renderFavs();
  });

  /* ===== 视图切换 ===== */
  var currentView = "chat";
  var mineTab = "fav";
  var feedLoaded = false;
  var toolsLoaded = false;

  function switchView(name){
    currentView = name;
    document.querySelectorAll(".nav-btn").forEach(function(b){
      b.classList.toggle("active", b.dataset.view === name);
    });
    document.querySelectorAll(".view").forEach(function(v){
      v.classList.toggle("active", v.id === "view-" + name);
    });
    if (name === "feed" && !feedLoaded) loadFeedTabs();
    if (name === "tools" && !toolsLoaded) loadTools();
    if (name === "mine") renderMine();
  }
  $("nav").addEventListener("click", function(e){
    var b = e.target.closest(".nav-btn");
    if (b) switchView(b.dataset.view);
  });

  /* ===== 信息聚合 ===== */
  var feedState = { category: "", page: 1, size: 15, total: 0 };

  function feedItemHtml(it){
    return '<div class="feed-item"><div class="fi-main">' +
      '<a class="fi-title" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
      esc(it.title) + "</a>" +
      '<div class="fi-meta">' + esc(it.board || it.site || "") + " · " + esc(it.time) + "</div>" +
      '<div class="fi-snippet">' + esc(it.snippet) + "</div></div>" +
      favBtnHtml(it) + "</div>";
  }

  function loadFeedTabs(){
    feedLoaded = true;
    fetch("/api/feed/categories").then(function(r){
      if (!r.ok) throw new Error("bad status");
      return r.json();
    }).then(function(res){
      var cats = res.categories || [];
      $("feedTabs").innerHTML = cats.map(function(c, i){
        return '<button class="ftab' + (i === 0 ? " active" : "") +
          '" data-cat="' + esc(c.id) + '">' + esc(c.name) + "</button>";
      }).join("");
      if (cats.length){
        feedState.category = cats[0].id;
        loadFeed();
      } else {
        $("feedList").innerHTML = '<div class="empty">暂无分类</div>';
      }
    }).catch(function(){
      $("feedList").innerHTML = '<div class="empty">分类加载失败，请刷新重试</div>';
    });
  }

  function loadFeed(){
    $("feedList").innerHTML = '<div class="empty">加载中…</div>';
    fetch("/api/feed?category=" + encodeURIComponent(feedState.category) +
      "&page=" + feedState.page + "&size=" + feedState.size
    ).then(function(r){
      if (!r.ok) throw new Error("bad status");
      return r.json();
    }).then(function(res){
      feedState.total = res.total || 0;
      var items = res.items || [];
      if (!items.length){
        $("feedList").innerHTML = '<div class="empty">暂无内容，换个分类看看</div>';
      } else {
        $("feedList").innerHTML = items.map(feedItemHtml).join("");
      }
      var pages = Math.max(1, Math.ceil(feedState.total / feedState.size));
      $("pageInfo").textContent = feedState.page + " / " + pages + " · 共 " +
        feedState.total + " 条";
      $("prevPage").disabled = feedState.page <= 1;
      $("nextPage").disabled = feedState.page >= pages;
    }).catch(function(){
      $("feedList").innerHTML = '<div class="empty">加载失败，请重试</div>';
    });
  }

  $("feedTabs").addEventListener("click", function(e){
    var b = e.target.closest(".ftab");
    if (!b) return;
    document.querySelectorAll(".ftab").forEach(function(t){
      t.classList.remove("active");
    });
    b.classList.add("active");
    feedState.category = b.dataset.cat;
    feedState.page = 1;
    loadFeed();
  });
  $("prevPage").addEventListener("click", function(){
    if (feedState.page > 1){ feedState.page--; loadFeed(); }
  });
  $("nextPage").addEventListener("click", function(){
    feedState.page++; loadFeed();
  });

  /* ===== 校园工具 ===== */
  function loadTools(){
    toolsLoaded = true;
    fetch("/api/tools").then(function(r){
      if (!r.ok) throw new Error("bad status");
      return r.json();
    }).then(function(res){
      var tools = res.tools || [];
      if (!tools.length){
        $("toolGrid").innerHTML = '<div class="empty">暂无工具</div>';
        return;
      }
      $("toolGrid").innerHTML = tools.map(function(t){
        return '<button class="tool-card" data-tool="' + esc(t.id) + '">' +
          '<div class="t-name">' + esc(t.name) + "</div>" +
          '<div class="t-desc">' + esc(t.desc) + "</div></button>";
      }).join("");
    }).catch(function(){
      $("toolGrid").innerHTML = '<div class="empty">工具加载失败，请刷新重试</div>';
    });
  }

  $("toolGrid").addEventListener("click", function(e){
    var card = e.target.closest(".tool-card");
    if (!card) return;
    document.querySelectorAll(".tool-card").forEach(function(c){
      c.classList.remove("active");
    });
    card.classList.add("active");
    var id = card.dataset.tool;
    $("toolResult").innerHTML = '<div class="empty">检索中…</div>';
    fetch("/api/tools/" + encodeURIComponent(id)).then(function(r){
      if (!r.ok) throw new Error("bad status");
      return r.json();
    }).then(function(res){
      if (res.error){
        $("toolResult").innerHTML = '<div class="empty">' + esc(res.error) + "</div>";
        return;
      }
      var items = res.items || [];
      var head = '<div class="tr-head"><span class="tr-title">' +
        esc(res.name) + " · 相关资料（" + items.length + "）</span>" +
        '<button class="quick ask-btn" data-ask="' + esc(res.ask || "") +
        '">去问答深挖 →</button></div>';
      if (!items.length){
        $("toolResult").innerHTML = head +
          '<div class="empty">知识库未找到相关资料，可点右侧按钮去问答页提问</div>';
        return;
      }
      $("toolResult").innerHTML = head +
        '<div class="feed-list">' + items.map(feedItemHtml).join("") + "</div>";
    }).catch(function(){
      $("toolResult").innerHTML = '<div class="empty">检索失败，请重试</div>';
    });
  });

  $("toolResult").addEventListener("click", function(e){
    var b = e.target.closest(".ask-btn");
    if (!b || !b.dataset.ask) return;
    switchView("chat");
    send(b.dataset.ask);
  });

  /* ===== 我的（收藏 / 订阅） ===== */
  function renderMine(){
    if (mineTab === "fav") renderFavs();
    else renderSubs();
  }

  function renderFavs(){
    var list = loadFavs();
    if (!list.length){
      $("mineFav").innerHTML =
        '<div class="empty">还没有收藏，点击条目右侧 ☆ 收藏</div>';
      return;
    }
    $("mineFav").innerHTML = '<div class="feed-list">' +
      list.map(feedItemHtml).join("") + "</div>";
  }

  function renderSubs(){
    var subs = loadSubs();
    var html = '<div class="sub-bar">' +
      '<select id="subSel"><option value="">选择板块订阅…</option></select>' +
      '<button class="quick" id="subAdd">添加订阅</button></div>';
    html += '<div class="chips">';
    if (subs.length){
      html += subs.map(function(b){
        return '<span class="chip">' + esc(b) +
          '<span class="x" data-board="' + esc(b) + '" title="取消订阅">×</span></span>';
      }).join("");
    } else {
      html += '<span style="font-size:12.5px;color:var(--text-3)">未订阅任何板块</span>';
    }
    html += "</div><div id=\"subUpdates\"></div>";
    $("mineSub").innerHTML = html;

    // 板块下拉（排除已订阅）
    fetch("/api/boards").then(function(r){
      if (!r.ok) throw new Error("bad status");
      return r.json();
    }).then(function(res){
      var sel = $("subSel");
      if (!sel) return;
      (res.boards || []).forEach(function(b){
        if (subs.indexOf(b.name) >= 0) return;
        var opt = document.createElement("option");
        opt.value = b.name;
        opt.textContent = b.name + "（" + b.count + "）";
        sel.appendChild(opt);
      });
    }).catch(function(){});

    // 订阅板块最新内容
    if (!subs.length) return;
    $("subUpdates").innerHTML = '<div class="empty">加载订阅更新…</div>';
    Promise.all(subs.map(function(board){
      return fetch("/api/feed?board=" + encodeURIComponent(board) + "&size=5")
        .then(function(r){ return r.json(); })
        .then(function(res){ return { board: board, items: res.items || [] }; })
        .catch(function(){ return { board: board, items: [] }; })
    })).then(function(groups){
      $("subUpdates").innerHTML =
        '<div class="mine-section-title">订阅板块最新</div>' +
        groups.map(function(g){
          return '<div class="sub-group"><h3>' + esc(g.board) + "</h3>" +
            (g.items.length
              ? '<div class="feed-list">' + g.items.map(feedItemHtml).join("") + "</div>"
              : '<div class="empty" style="padding:10px 0">暂无新内容</div>') +
            "</div>";
        }).join("");
    });
  }

  $("mineSub").addEventListener("click", function(e){
    var add = e.target.closest("#subAdd");
    if (add){
      var sel = $("subSel");
      if (!sel || !sel.value) return;
      var subs = loadSubs();
      if (subs.indexOf(sel.value) < 0){
        subs.push(sel.value);
        saveSubs(subs);
        renderSubs();
      }
      return;
    }
    var x = e.target.closest(".chip .x");
    if (x){
      var board = x.dataset.board;
      saveSubs(loadSubs().filter(function(b){ return b !== board; }));
      renderSubs();
    }
  });

  document.querySelectorAll(".mtab").forEach(function(t){
    t.addEventListener("click", function(){
      mineTab = t.dataset.mine;
      document.querySelectorAll(".mtab").forEach(function(m){
        m.classList.toggle("active", m.dataset.mine === mineTab);
      });
      renderMine();
    });
  });

  /* ===== 智能问答（原有逻辑 + 来源收藏） ===== */
  var qa = {
    "保研成绩怎么算？": {
      a: "保研综合成绩一般由学业成绩与综合素质测评构成，不同学院权重可能不同，具体以教务处当年通知为准。",
      src: "教务处官网（示例）"
    },
    "这学期校历安排": {
      a: "校历页签提供教学周、考试周与假期安排，具体日期以学校官方发布为准。",
      src: "学校官网 · 校历（示例）"
    },
    "清水河到沙河班车时刻": {
      a: "工作日开行通勤班车，发车时间与站点以后勤保障部最新通知为准。",
      src: "后勤保障部（示例）"
    }
  };
  var fallback = {
    a: "这个问题知识库暂未收录，建议去对应部门官网核实。",
    src: "知识库未收录"
  };

  var area = $("msgArea");
  var input = $("chatInput");
  var sendBtn = $("sendBtn");
  var boardSel = $("boardSel");
  var timeSel = $("timeSel");

  // 加载板块列表（失败时仅保留「全部板块」）
  fetch("/api/boards").then(function(r){
    if (!r.ok) throw new Error("bad status");
    return r.json();
  }).then(function(res){
    (res.boards || []).forEach(function(b){
      var opt = document.createElement("option");
      opt.value = b.name;
      opt.textContent = b.name + "（" + b.count + "）";
      boardSel.appendChild(opt);
    });
  }).catch(function(){});

  function scrollBottom(){ area.scrollTop = area.scrollHeight; }

  function addMsg(role, html){
    var wrap = document.createElement("div");
    wrap.className = "msg " + role;
    var avatar = role === "user"
      ? '<span class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>'
      : '<span class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c2.8 1.4 5 1.8 7 1.8v8.2c0 4.4-3.4 8-7 10-3.6-2-7-5.6-7-10V4.8c2 0 4.2-.4 7-1.8z"/><path d="M12 6v13M9.5 10h5"/></svg></span>';
    wrap.innerHTML = avatar + '<div class="bubble">' + html + "</div>";
    area.appendChild(wrap);
    scrollBottom();
  }

  function showTyping(){
    var wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typingMsg";
    wrap.innerHTML = '<span class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c2.8 1.4 5 1.8 7 1.8v8.2c0 4.4-3.4 8-7 10-3.6-2-7-5.6-7-10V4.8c2 0 4.2-.4 7-1.8z"/><path d="M12 6v13M9.5 10h5"/></svg></span>' +
      '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    area.appendChild(wrap);
    scrollBottom();
  }

  function removeTyping(){
    var t = document.getElementById("typingMsg");
    if (t) t.remove();
  }

  function srcLine(src){
    var icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3h7v7M21 3l-9 9"/><path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>';
    return '<div class="src-line">' + icon + (src === "知识库未收录" ? "知识库未收录" : "来源：" + esc(src)) + "</div>";
  }

  // 全部来源列表（可展开，每条可收藏）
  function sourcesBlock(sources){
    if (!sources || !sources.length) return "";
    var html = '<details class="src-detail"><summary>全部来源（' +
      sources.length + "）</summary>";
    sources.forEach(function(s, i){
      var item = {
        title: s.title, url: s.source,
        board: s.board_name, time: (s.create_time || "").slice(0, 10)
      };
      html += '<div class="src-item"><a href="' + esc(s.source) +
        '" target="_blank" rel="noopener">[' + (i + 1) + "] " +
        esc(s.title) + "</a>" +
        '<span class="src-meta">' + esc(s.board_name) + " · " +
        esc((s.create_time || "").slice(0, 10)) + "</span>" +
        favBtnHtml(item, true) + "</div>";
    });
    return html + "</details>";
  }

  function localReply(text){
    var entry = qa[text] || fallback;
    setTimeout(function(){
      removeTyping();
      addMsg("bot", entry.a + srcLine(entry.src));
    }, 900 + Math.random() * 500);
  }

  function send(text){
    text = (text || "").trim();
    if (!text) return;
    if (currentView !== "chat") switchView("chat");
    addMsg("user", esc(text));
    input.value = "";
    showTyping();
    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: text,
        board: boardSel.value || null,
        time_range: timeSel.value || null
      })
    }).then(function(r){
      if (!r.ok) throw new Error("bad status");
      return r.json();
    }).then(function(res){
      removeTyping();
      addMsg("bot", esc(res.answer) + srcLine(res.source) +
        sourcesBlock(res.sources));
    }).catch(function(){
      localReply(text);
    });
  }

  sendBtn.addEventListener("click", function(){ send(input.value); });
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter") send(input.value);
  });
  $("quickRow").addEventListener("click", function(e){
    var b = e.target.closest(".quick");
    if (b) send(b.getAttribute("data-q"));
  });
})();
</script>
</body>
</html>
